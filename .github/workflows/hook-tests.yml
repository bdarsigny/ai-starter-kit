name: hook tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are often unavailable on free GitHub (jobs get cancelled for capacity); the Mac path
        # (bash 3.2) is tested locally instead. Ubuntu covers general bash portability.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Mirror Git for Windows' installer default so CRLF problems would show up here.
      - name: Use Git for Windows default line-ending setting
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Hook tests
        run: bash tests/test_hooks.sh
      - name: Tool tests
        run: bash tests/test_tools.sh
